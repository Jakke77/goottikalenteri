name: Build calendar and widget AppImages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        default: v0.2.2

permissions:
  contents: write

jobs:
  appimages:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out the release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils squashfs-tools libegl1 libopengl0 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 libxcb-shape0 libxcb-keysyms1 libxkbcommon-x11-0 libxcb-xkb1
          python -m pip install -r requirements-build.txt
      - name: Test the calendar and desktop controls
        run: python -m unittest discover -s tests -v
      - name: Build and smoke-test both AppImages
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python packaging/build_appimage.py --version "${RELEASE_TAG#v}" --variant both
      - name: Upload verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          cd release-assets
          sha256sum -c SHA256SUMS
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber *.AppImage *-source.zip build-info.json SHA256SUMS
